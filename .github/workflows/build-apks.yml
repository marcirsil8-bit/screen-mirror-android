name: Build APKs

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
    
    - name: Set up Android SDK
      uses: android-actions/setup-android@v3
      with:
        api-level: 34
        build-tools-version: '34.0.0'
    
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
    
    - name: Build Sender APK
      working-directory: sender
      run: gradle assembleDebug --no-daemon
    
    - name: Build Receiver APK
      working-directory: receiver
      run: gradle assembleDebug --no-daemon
    
    - name: Upload Sender APK
      uses: actions/upload-artifact@v4
      with:
        name: screen-mirror-sender-apk
        path: sender/app/build/outputs/apk/debug/*.apk
        retention-days: 90
    
    - name: Upload Receiver APK
      uses: actions/upload-artifact@v4
      with:
        name: screen-mirror-receiver-apk
        path: receiver/app/build/outputs/apk/debug/*.apk
        retention-days: 90
